<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0d6efd" />
      <stop offset="100%" stop-color="#083344" />
    </linearGradient>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Card with Rounded Corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Subtle Inner Border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="4" />

  <!-- Background Decorative Pulse / Waves -->
  <path d="M 64 256 L 144 256 L 180 180 L 228 340 L 276 210 L 308 280 L 336 256 L 448 256" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Glowing Medical Cross Badge -->
  <g filter="url(#dropShadow)">
    <!-- Central Medical Plus -->
    <path d="M 220 120 C 220 108.954 228.954 100 240 100 L 272 100 C 283.046 100 292 108.954 292 120 L 292 220 L 392 220 C 403.046 220 412 228.954 412 240 L 412 272 C 412 283.046 403.046 292 392 292 L 292 292 L 292 392 C 292 403.046 283.046 412 272 412 L 240 412 C 228.954 412 220 403.046 220 392 L 220 292 L 120 292 C 108.954 292 100 283.046 100 240 L 100 240 C 100 228.954 108.954 220 120 220 L 220 220 Z" fill="url(#crossGrad)" />
  </g>

  <!-- Stethoscope / Heart Symbol Overlay -->
  <circle cx="256" cy="256" r="32" fill="url(#glowGrad)" filter="url(#dropShadow)" />
  <path d="M 244 256 L 252 264 L 268 248" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- App Name Lettering Accent (CMS Badge) -->
  <g transform="translate(180, 424)">
    <rect x="0" y="0" width="152" height="40" rx="20" fill="rgba(255,255,255,0.22)" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" />
    <text x="76" y="26" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="900" letter-spacing="3" text-anchor="middle">DHYEY CMS</text>
  </g>
</svg>
