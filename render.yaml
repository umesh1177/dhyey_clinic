services:
  - type: web
    name: dhyey-clinic-cms
    runtime: node
    region: singapore
    plan: free

    buildCommand: cd frontend && npm ci && npm run build && cd ../backend && npm ci

    startCommand: cd backend && npm start

    healthCheckPath: /api/health

    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_EXPIRE
        value: 30d
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
