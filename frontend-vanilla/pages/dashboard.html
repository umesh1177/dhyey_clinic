<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Dhyey Clinic Management System</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body class="cms-root">
  <div class="cms-layout">
    <main class="cms-main-container">
      <header class="cms-topbar">
        <div class="cms-topbar-left">
          <a href="../index.html" class="cms-btn-ghost cms-btn-icon" style="text-decoration: none;"><i class="fa-solid fa-house"></i></a>
          <h1 class="cms-topbar-title">Clinic Dashboard</h1>
        </div>
        <div class="cms-topbar-right">
          <a href="../index.html" class="cms-btn cms-btn-primary">Open Main App</a>
        </div>
      </header>
      <section class="cms-content-area" id="page-dashboard-container"></section>
    </main>
  </div>

  <script type="module">
    import { renderDashboard } from '../js/dashboard.js';
    renderDashboard(document.getElementById('page-dashboard-container'), (famId, patId) => {
      window.location.href = `../index.html?fam=${famId}&pat=${patId}`;
    });
  </script>
</body>
</html>
