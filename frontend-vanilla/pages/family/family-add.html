<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Family - Dhyey Clinic Management System</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="../../css/patient.css">
</head>
<body class="cms-root">
  <div class="cms-layout">
    <main class="cms-main-container">
      <header class="cms-topbar">
        <div class="cms-topbar-left">
          <a href="family-list.html" class="cms-btn-ghost cms-btn-icon" style="text-decoration: none;"><i class="fa-solid fa-arrow-left"></i></a>
          <h1 class="cms-topbar-title">Register Family Head</h1>
        </div>
      </header>
      <section class="cms-content-area" id="page-family-add-container"></section>
    </main>
  </div>

  <script type="module">
    import { renderFamilyRegistration } from '../../js/family.js';
    renderFamilyRegistration(document.getElementById('page-family-add-container'), null, (famId) => {
      window.location.href = `../patients/patient-add.html?fam=${famId}`;
    });
  </script>
</body>
</html>
