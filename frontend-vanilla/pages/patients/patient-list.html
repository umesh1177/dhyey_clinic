<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patients Directory - Dhyey Clinic Management System</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="../../css/patient.css">
</head>
<body class="cms-root">
  <div class="cms-layout">
    <main class="cms-main-container">
      <header class="cms-topbar">
        <div class="cms-topbar-left">
          <a href="../../index.html" class="cms-btn-ghost cms-btn-icon" style="text-decoration: none;"><i class="fa-solid fa-house"></i></a>
          <h1 class="cms-topbar-title">Patients Directory</h1>
        </div>
        <div class="cms-topbar-right">
          <a href="patient-add.html" class="cms-btn cms-btn-primary"><i class="fa-solid fa-plus"></i> Add New Patient</a>
        </div>
      </header>
      <section class="cms-content-area" id="page-patients-container"></section>
    </main>
  </div>

  <script type="module">
    import { renderPatientRegistration } from '../../js/patient.js';
    renderPatientRegistration(document.getElementById('page-patients-container'), null, (famId, patId) => {
      window.location.href = `../../index.html?fam=${famId}&pat=${patId}`;
    });
  </script>
</body>
</html>
